[project]
name = "ace-chunk-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ace-canonical-schemas",
  "ace-shared",
]

[project.optional-dependencies]
chonkie = ["chonkie>=0.4.0"]
docling = ["docling>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-canonical-schemas = { path = "../canonical_schemas", editable = true }
ace-shared = { path = "../shared", editable = true }
