[project]
name = "ace-document-parsers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ace-canonical-schemas",
  "ace-shared",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "markdown-it-py>=3.0.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0.0"]
ocr = ["pytesseract>=0.3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-canonical-schemas = { path = "../canonical_schemas", editable = true }
ace-shared = { path = "../shared", editable = true }
