[project]
name = "ace-evaluation-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ace-canonical-schemas",
  "ace-chunk-adapters",
  "ace-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-canonical-schemas = { path = "../canonical_schemas", editable = true }
ace-chunk-adapters = { path = "../chunk_adapters", editable = true }
ace-shared = { path = "../shared", editable = true }
