[project]
name = "ace-audit-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["ace-canonical-schemas", "ace-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-canonical-schemas = { path = "../canonical_schemas", editable = true }
ace-shared = { path = "../shared", editable = true }
