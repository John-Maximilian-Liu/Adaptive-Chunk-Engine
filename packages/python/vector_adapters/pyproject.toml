[project]
name = "ace-vector-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ace-shared",
  "httpx>=0.27.0",
  "pydantic>=2.7,<3",
  "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-shared = { path = "../shared", editable = true }
