[project]
name = "ace-visual-processing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ace-canonical-schemas",
  "ace-shared",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.9.0"]
vtracer = ["vtracer>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-canonical-schemas = { path = "../canonical_schemas", editable = true }
ace-shared = { path = "../shared", editable = true }
