[project]
name = "ace-canonical-schemas"
version = "0.1.0"
description = "Canonical schemas for Adaptive Chunk Engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "ace-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
ace-shared = { path = "../shared", editable = true }
