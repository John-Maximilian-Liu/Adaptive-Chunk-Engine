name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx aiosqlite jsonschema ruff mypy
      - name: Ruff
        run: source .venv/bin/activate && ruff check app tests || true
      - name: Typecheck
        run: source .venv/bin/activate && mypy app || true
      - name: Unit + integration
        env:
          PYTHONPATH: ../../packages/python:.:../../workers
        run: source .venv/bin/activate && pytest -q --cov=app --cov=../../packages/python
      - name: JSON Schema contracts
        env:
          PYTHONPATH: ../../packages/python:.:../../workers
        run: source .venv/bin/activate && pytest -q tests/contract/test_json_schema.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint || true
      - run: pnpm typecheck || true
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t ace-api:${GITHUB_SHA} .
          docker build -f apps/api/Dockerfile.worker -t ace-worker:${GITHUB_SHA} .
          docker build -f apps/web/Dockerfile -t ace-web:${GITHUB_SHA} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ace-api:${{ github.sha }}
          format: table
          exit-code: "0"
      - name: Dependency audit
        run: |
          pip install pip-audit || true
          pip-audit -r apps/api/requirements.txt || true

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-bicep@v2
      - run: bicep build infrastructure/bicep/main.bicep
